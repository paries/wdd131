<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="sun" cx="40%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#FFF6A8"/>
      <stop offset="55%" stop-color="#FFD23F"/>
      <stop offset="100%" stop-color="#FFA41B"/>
    </radialGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFC93C"/>
      <stop offset="100%" stop-color="#FF9F1C"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#EAF2FB"/>
      <stop offset="100%" stop-color="#C9DAEE"/>
    </linearGradient>
    <linearGradient id="cloudBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DCE8F6"/>
      <stop offset="100%" stop-color="#A9C1DD"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#3A5A80" flood-opacity="0.25"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Sun -->
  <g transform="translate(150 92)">
    <g fill="url(#ray)">
      <rect x="-6" y="-78" width="12" height="26" rx="6"/>
      <rect x="-6" y="-78" width="12" height="26" rx="6" transform="rotate(45)"/>
      <rect x="-6" y="-78" width="12" height="26" rx="6" transform="rotate(90)"/>
      <rect x="-6" y="-78" width="12" height="26" rx="6" transform="rotate(135)"/>
      <rect x="-6" y="-78" width="12" height="26" rx="6" transform="rotate(180)"/>
      <rect x="-6" y="-78" width="12" height="26" rx="6" transform="rotate(225)"/>
      <rect x="-6" y="-78" width="12" height="26" rx="6" transform="rotate(270)"/>
      <rect x="-6" y="-78" width="12" height="26" rx="6" transform="rotate(315)"/>
    </g>
    <circle r="44" fill="url(#sun)" filter="url(#glow)"/>
    <circle r="44" fill="none" stroke="#FF9F1C" stroke-width="3" opacity="0.6"/>
  </g>

  <!-- Back cloud -->
  <path d="M150 150
           a26 26 0 0 1 48 -10
           a22 22 0 0 1 30 26
           a16 16 0 0 1 -6 32
           h-70
           a24 24 0 0 1 -2 -48 z"
        fill="url(#cloudBack)" opacity="0.9"/>

  <!-- Front cloud -->
  <g filter="url(#shadow)">
    <path d="M60 214
             a34 34 0 0 1 -4 -67.6
             a46 46 0 0 1 86 -14
             a36 36 0 0 1 48 34
             a24 24 0 0 1 -2 47.6 z"
          fill="url(#cloud)"/>
  </g>
  <!-- Cloud highlight -->
  <path d="M74 160 a34 34 0 0 1 30 -24" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
</svg>
