<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form</title>
    <meta name="description" content="WDD 131 – Dynamic Web Fundamentals, Randy Paries, Product Review Form">
    <meta name="author" content="Randy Paries">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>
    <main>
        <form method="get" action="review.html">
            <fieldset>
                <label for="product">
                    Product Name <span class="required">*</span>
                </label>
                <select name="product" id="product" required>
                    <option value="" selected disabled hidden>Select a Product ...</option>
                </select>

                <div class="rating-container">
                    <div>Overall Rating<span class="required">*</span></div>
                    <div class="overall-rating">
                        <input type="radio" name="overallRating" value="5" id="star-a" required><label for="star-a"></label>
                        <input type="radio" name="overallRating" value="4" id="star-b" required><label for="star-b"></label>
                        <input type="radio" name="overallRating" value="3" id="star-c" required><label for="star-c"></label>
                        <input type="radio" name="overallRating" value="2" id="star-d" required><label for="star-d"></label>
                        <input type="radio" name="overallRating" value="1" id="star-e" required><label for="star-e"></label>
                    </div>
                </div>

            </fieldset>

            <fieldset>
                <label for="date">Date of installation<span class="required">*</span></label>
                <input id="date" type="date" name="dateOfInstallation" required>
            </fieldset>

            <fieldset>
                <div>What features did you find useful in the product?</div>
                <div class="checknote">(check all that apply)</div>
                <label><input type="checkbox" name="duribility" value="yes">Durability</label>
                <label><input type="checkbox" name="easeOfUse" value="yes">Ease of Use</label>
                <label><input type="checkbox" name="performance" value="yes">Performance</label>
                <label><input type="checkbox" name="design" value="yes">Design</label>
                <div class="review-container">
                    <label for="review">Written Review <span>(Optional)</span></label>
                    <textarea id="review" name="review"></textarea>
                </div>
            </fieldset>

            <fieldset >
                <label for="reviewer">Your Name <span>(Optional)</span></label><input id="reviewer" type="text" > 
            </fieldset>

            <fieldset class="submit-container">
                <input type="submit" value="Post Review">
            </fieldset>
        </form>
    </main>
    <footer>
        <p>&copy; <span id="currentyear"></span> &#x1F335; Randy Paries &#x1F335; Arizona</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
